<main class="news">
  @if (selectedItems().length) {
    <ul>
      @for (item of selectedItems(); track item.link; let counter = $index) {
        <li>
          @if (counter === 0) {
            <p class="date">{{ item.date }}</p>
            <p class="source">{{ item.source }}</p>
          }
          <h1>
            {{ item.title }}
          </h1>
          <div class="story">
            <p>
              @if (item.imageUrl) {
                <img [src]="item.imageUrl" [alt]="item.title" />
              }
              <span [innerHTML]="item.description"></span>
            </p>
          </div>
        </li>
      }
    </ul>
  } @else {
    <p class="empty">Geen nieuws gevonden.</p>
  }
</main>
